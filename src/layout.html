<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Peppi">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://peppi.style/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preload" href="assets/fonts/bodoni-moda-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bodoni-moda-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-tight-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css">
  <script>document.documentElement.classList.add("js");</script>
  <script src="assets/js/site.js" defer></script>
</head>
<body class="{{body_class}}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Peppi home">
        {{logo}}
        <span class="brand-name">Peppi</span>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav"><span></span>Menu</button>
      <nav class="nav" id="site-nav" aria-label="Main">
          {{nav}}
      </nav>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-top">
        <a class="brand brand--footer" href="index.html" aria-label="Peppi home">{{logo}}<span class="brand-name">Peppi</span></a>
        <nav class="footer-links" aria-label="Footer">
          <a href="about.html">About</a>
          <a href="faq.html">FAQ</a>
          <a href="support.html">Support</a>
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="delete-account.html">Delete your account</a>
        </nav>
      </div>
      <div class="footer-base">
        <span>© {{year}} Peppi</span>
        <span>Coming soon to Google Play · iPhone soon after</span>
      </div>
      {{credits}}
    </div>
  </footer>
</body>
</html>
